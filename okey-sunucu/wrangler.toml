# Bekleniyor okey sunucusu. Yayın: npx wrangler deploy (bu klasörde). Yerel deneme: npx wrangler dev
name = "bekleniyor-okey"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "MASA"
class_name = "OkeyMasasi"

# Ücretsiz planda Durable Object'ler SQLite depolamalı olmalı
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OkeyMasasi"]

[[durable_objects.bindings]]
name = "BILARDO"
class_name = "BilardoMasasi"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BilardoMasasi"]

# Oda arka plan videoları (asıl dosya, dönüştürülmeden). Yükleme: POST /medya, okuma: GET /medya/<sha256>.<mp4|webm>
[[kv_namespaces]]
binding = "MEDYA"
id = "946c02717dc34271a69a4d40776bc4bc"
