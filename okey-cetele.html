<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Okey Çetelesi · Bekleniyor</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<!-- Çetele artık odanın içinde açılıyor ve site sadece Google girişiyle görülebiliyor. Eski çetele linkleri
     odaya (okey masası açık) yönlenir; giriş yapılmadıysa önce giriş ekranı çıkar. -->
<script>
  (function () {
    var oda = new URLSearchParams(location.search).get("oda") || "";
    location.replace(/^[A-Za-z0-9_-]{1,64}$/.test(oda) ? "./?oda=" + encodeURIComponent(oda) + "&okey=1" : "./");
  })();
</script>
</head>
<body style="background:#0d1612"></body>
</html>
